name: Build and deploy Next.js to Azure Web App - dhanarajportfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run build

      - name: Prepare standalone output
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force .next\static .next\standalone\.next\static
          Copy-Item -Recurse -Force public .next\standalone\public

      - name: Write web.config
        shell: pwsh
        run: |
          $webconfig = @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <handlers>
                <add name="iisnode" path="server.js" verb="*" modules="iisnode" />
              </handlers>
              <rewrite>
                <rules>
                  <rule name="StaticAssets" stopProcessing="true">
                    <match url="^(_next|public)(/.*)?" />
                    <action type="None" />
                  </rule>
                  <rule name="NextJS" stopProcessing="true">
                    <match url=".*" />
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="server.js" />
                  </rule>
                </rules>
              </rewrite>
              <iisnode node_env="production" loggingEnabled="true" logDirectory="iisnode" />
              <security>
                <requestFiltering>
                  <hiddenSegments>
                    <add segment="node_modules" />
                    <add segment=".next" />
                  </hiddenSegments>
                </requestFiltering>
              </security>
            </system.webServer>
          </configuration>
          '@
          Set-Content -Path ".next\standalone\web.config" -Value $webconfig

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5378802020FF413586AEF24B994CC94F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5A298B81F76140778068F66F5B5CBADD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_14A1C37FC07C4EE59AD9C4850DCBDB89 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'dhanarajportfolio'
          slot-name: 'Production'
          package: .
          startup-command: 'node server.js'
